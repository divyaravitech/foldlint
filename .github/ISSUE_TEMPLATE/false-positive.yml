name: False positive / false negative
description: FoldLint flagged correct code, or missed a real problem
labels: [rule-accuracy]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: uiscreen-main
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal Swift snippet
      render: swift
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
